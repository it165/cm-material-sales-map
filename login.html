<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Sales Territory</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ดึงไลบรารี LINE LIFF SDK มาใช้งาน -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="h-full text-slate-800 flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-100">

    <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center border border-slate-200/60">
        <div class="w-20 h-20 bg-brand-100 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
            <i class="fa-solid fa-map-location-dot text-4xl text-brand-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Sales Territory & AI</h2>
        <p class="text-sm text-slate-500 mb-8">ระบบแผนที่และวิเคราะห์เขตการขายอัจฉริยะ</p>
        
        <div class="space-y-4">
            <!-- ปุ่มเข้าสู่ระบบผู้บริหาร -->
            <button onclick="login('admin')" class="w-full bg-[#00B900] hover:bg-[#009900] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-[#00B900]/30 transition flex items-center justify-center gap-3">
                <i class="fa-brands fa-line text-2xl"></i>
                เข้าสู่ระบบ (ผู้บริหาร)
            </button>
            
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs">หรือ</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- ปุ่มเข้าสู่ระบบพนักงานขาย -->
            <button onclick="login('sales')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl border border-slate-300 transition flex items-center justify-center gap-3">
                <i class="fa-solid fa-user-tie text-lg text-slate-500"></i>
                เข้าสู่ระบบ (พนักงานขาย)
            </button>
        </div>
        
        <!-- ส่วนลงทะเบียน -->
        <div class="mt-6 text-sm text-slate-500">
            ยังไม่มีบัญชีผู้ใช้งาน? 
            <button onclick="register()" class="text-brand-600 font-semibold hover:text-brand-700 hover:underline transition focus:outline-none">ลงทะเบียนที่นี่</button>
        </div>
        
        <div class="mt-6 text-[10px] text-slate-400">
            &copy; 2026 Sales Territory Analytics System
        </div>
    </div>

    <script>
        // ==========================================
        // การตั้งค่า LINE LIFF
        // ==========================================
        // TODO: นำ LIFF ID ที่ได้จาก LINE Developers Console มาใส่ตรงนี้
        const LIFF_ID = "YOUR_LIFF_ID_HERE"; 

        // เริ่มต้นกระบวนการเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = async function() {
            // ตรวจสอบว่าเคยล็อกอินค้างไว้หรือไม่
            const savedRole = localStorage.getItem('userRole');
            if (savedRole === 'admin') goToPage('index.html');
            if (savedRole === 'sales') goToPage('add_store.html');

            // เริ่มต้นระบบ LIFF
            if (LIFF_ID !== "YOUR_LIFF_ID_HERE") {
                try {
                    await liff.init({ liffId: LIFF_ID });
                } catch (err) {
                    console.error('LIFF Init Error:', err);
                }
            }
        }

        // ฟังก์ชันสร้าง Toast Message
        function alertMsg(msg, isSuccess = true) {
            const toast = document.createElement('div');
            const bgColor = isSuccess ? 'bg-slate-800/95' : 'bg-rose-600/95';
            toast.className = `fixed top-10 left-1/2 transform -translate-x-1/2 ${bgColor} backdrop-blur text-white px-5 py-3 rounded-xl text-sm shadow-2xl z-[9999] opacity-0 transition-all duration-300 text-center min-w-[280px] leading-relaxed`;
            toast.innerHTML = msg; 
            document.body.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('opacity-0'); toast.classList.add('translate-y-2'); }, 10);
            setTimeout(() => {
                toast.classList.remove('translate-y-2'); toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ฟังก์ชันช่วยเปลี่ยนหน้า
        function goToPage(page) {
            if (window.location.protocol === 'blob:') {
                alertMsg('⚠️ <b>แจ้งเตือนจากโหมด Preview:</b><br>ระบบจริงจะพาไปที่ <b>' + page + '</b>');
            } else {
                window.location.href = page;
            }
        }

        // ฟังก์ชันล็อกอินผ่าน LINE
        async function login(role) {
            // 1. ถ้ายังไม่ได้ใส่ LIFF ID หรืออยู่ในโหมดทดสอบ ให้จำลองการดึง UID เพื่อให้คุณทำงานต่อได้
            if (window.location.protocol === 'blob:' || LIFF_ID === "YOUR_LIFF_ID_HERE") {
                alertMsg('⚠️ <b>โหมดทดสอบ/ขาด LIFF ID:</b><br>จำลองการดึง UID ของ LINE สำเร็จ');
                proceedLogin(role, 'MOCK_UID_1234567890', 'ทดสอบผู้ใช้งาน');
                return;
            }

            // 2. กระบวนการล็อกอินผ่าน LINE ของจริง
            try {
                if (!liff.isLoggedIn()) {
                    // ถ้ายังไม่ได้ล็อกอิน ให้เด้งไปหน้าล็อกอินของ LINE
                    // พอเสร็จแล้วจะกลับมาที่หน้าเว็บนี้อัตโนมัติ
                    liff.login({ redirectUri: window.location.href }); 
                } else {
                    // ถ้าล็อกอินแล้ว ดึงข้อมูลโปรไฟล์ได้เลย
                    const profile = await liff.getProfile();
                    const uid = profile.userId;
                    const displayName = profile.displayName;
                    // const pictureUrl = profile.pictureUrl; // ไว้ดึงรูปโปรไฟล์มาแสดงทีหลังได้

                    alertMsg(`✅ เข้าสู่ระบบสำเร็จ!<br>ยินดีต้อนรับคุณ <b>${displayName}</b>`);
                    
                    // บันทึก UID แล้วเข้าสู่ระบบ
                    proceedLogin(role, uid, displayName);
                }
            } catch (error) {
                console.error('LINE Login Error:', error);
                alertMsg('❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับ LINE', false);
            }
        }

        // ฟังก์ชันบันทึกข้อมูลและเปลี่ยนหน้า
        function proceedLogin(role, uid, displayName) {
            // บันทึกข้อมูลลงเบราว์เซอร์
            localStorage.setItem('userRole', role);
            localStorage.setItem('lineUid', uid);
            localStorage.setItem('lineName', displayName);
            
            // เปลี่ยนหน้า (หน่วงเวลา 1.5 วิ ให้แสดงข้อความต้อนรับจบก่อน)
            setTimeout(() => {
                if (role === 'admin') goToPage('index.html');
                else goToPage('add_store.html');
            }, 1500);
        }

        // ฟังก์ชันสำหรับปุ่มลงทะเบียน
        function register() {
            alertMsg('🛠️ <b>ระบบกำลังอยู่ระหว่างการพัฒนา</b><br>ฟังก์ชันลงทะเบียนพนักงานใหม่จะเปิดให้ใช้งานเร็วๆ นี้<br>กรุณาติดต่อ Admin เพื่อขอรับสิทธิ์ชั่วคราวครับ');
        }
    </script>
</body>
</html>
